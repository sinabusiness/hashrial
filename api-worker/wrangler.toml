name = "hashrial-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://hashrial.com"
STRATUM_HOST = "hashrial.com"
MAIN_SUBACCOUNT = "hashrial"

# Admin allow-list: comma-separated user UUIDs. Deliberately an ID list here
# rather than a role column in the database — a role can be escalated by
# anything able to write to the database, whereas changing this requires a
# deploy. Every /admin/* endpoint re-checks it server-side; the sidebar entry
# only appears for these users as a convenience, never as the control.
ADMIN_USER_IDS = "6830a5d0-c5fa-4515-bff1-f0badf7a770b"

# Which upstream pool the backend polls. MUST match proxy/.env's ACTIVE_POOL —
# if the proxy forwards to Braiins while this still says antpool, the poller
# queries sub-accounts receiving no hashrate and every user reads zero.
#   antpool -> per-user sub-accounts, polled by the Express antpoolPoller
#   braiins -> ONE aggregate account; per-user figures are derived here by
#              parsing `hashrial.{user}_{worker}` worker labels
# Set to braiins. The poller stays inert until BRAIINS_TOKEN is set, so this is
# safe to commit ahead of the account existing:
#   wrangler secret put BRAIINS_TOKEN
# Verify the live response shape before trusting it with balances:
#   BRAIINS_TOKEN=xxxx node scripts/verify-braiins.js
ACTIVE_POOL = "braiins"
BRAIINS_ACCOUNT = "hashrial"
# BRAIINS_TOKEN is a credential and must NOT live here. Set it with:
#   wrangler secret put BRAIINS_TOKEN
MIN_PAYOUT_BTC = "0.001"
# EMAIL_FROM is an address, not a credential, so it's fine in this
# committed file. RESEND_API_KEY is deliberately NOT here — set it with:
#   wrangler secret put RESEND_API_KEY
EMAIL_FROM = "Hashrial <noreply@hashrial.com>"

# Manual FX pins. IRR and TMN now come LIVE from صراف's own feed (Wallex
# USDT/IRR) so there is nothing to pin here — a hardcoded 1,780,000 had already
# drifted 8.2% below the live 1,938,950, understating every Iranian balance.
# Only set this for a pair صراف does not cover, or to freeze one during an
# outage. JSON, currency -> units per 1 USD, e.g. {"IQD":1310}
FX_OVERRIDES = '{}'

# Populates the BTC price + FX cache. Without a trigger the Worker has no way
# to run it (no timers), and /public/btcprice 503s — which is what production
# was doing before this was added.
[triggers]
crons = ["*/5 * * * *"]

# NOTE: Cloudflare Email Sending bills monthly, so Hashrial uses its own free
# Resend account instead (Resend verifies one domain per account and صراف holds
# the slot on the other). To switch, uncomment this and run:
#   wrangler email sending enable hashrial.com
# [[send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["noreply@hashrial.com"]
