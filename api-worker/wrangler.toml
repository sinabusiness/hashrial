name = "hashrial-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://hashrial.com"
STRATUM_HOST = "hashrial.com"
MAIN_SUBACCOUNT = "hashrial"
MIN_PAYOUT_BTC = "0.001"
# EMAIL_FROM is an address, not a credential, so it's fine in this
# committed file. RESEND_API_KEY is deliberately NOT here — set it with:
#   wrangler secret put RESEND_API_KEY
EMAIL_FROM = "Hashrial <noreply@hashrial.com>"
